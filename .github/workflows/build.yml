name: build
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add data
          git commit -m update || exit 0
          git push
